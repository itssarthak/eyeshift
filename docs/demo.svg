<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Eyeshift: keyboard focus follows your eyes across screens, windows and split panes</title>
<defs>
<filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<radialGradient id="gaze"><stop offset="0" stop-color="#F43F5E" stop-opacity="0.95"/><stop offset="0.55" stop-color="#F43F5E" stop-opacity="0.45"/><stop offset="1" stop-color="#F43F5E" stop-opacity="0"/></radialGradient>
</defs>
<rect width="960" height="420" rx="18" fill="#0F172A"/>
<rect x="40" y="36" width="420" height="262" rx="12" fill="#0B1220" stroke="#475569" stroke-width="2"/><rect x="230" y="298" width="40" height="22" fill="#475569"/><rect x="190" y="318" width="120" height="8" rx="4" fill="#475569"/><rect x="500" y="36" width="420" height="262" rx="12" fill="#0B1220" stroke="#475569" stroke-width="2"/><rect x="690" y="298" width="40" height="22" fill="#475569"/><rect x="650" y="318" width="120" height="8" rx="4" fill="#475569"/>
<!-- left screen: editor window holding pane A, notes window B -->
<rect x="52" y="52" width="214" height="236" rx="8" fill="#111827" stroke="#334155"/><rect x="52" y="52" width="214" height="20" rx="8" fill="#1F2937"/><rect x="52" y="64" width="214" height="8" fill="#1F2937"/><circle cx="64" cy="62" r="3.5" fill="#F87171"/><circle cx="76" cy="62" r="3.5" fill="#FBBF24"/><circle cx="88" cy="62" r="3.5" fill="#34D399"/><text x="159.0" y="66" font-size="10" fill="#94A3B8" text-anchor="middle">editor.swift</text><rect x="82" y="90" width="127" height="6" rx="3" fill="#2E5A6B"/><rect x="70" y="106" width="64" height="6" rx="3" fill="#334155"/><rect x="82" y="122" width="99" height="6" rx="3" fill="#334155"/><rect x="70" y="138" width="65" height="6" rx="3" fill="#2E5A6B"/><rect x="70" y="154" width="78" height="6" rx="3" fill="#2E5A6B"/><rect x="70" y="170" width="127" height="6" rx="3" fill="#334155"/><rect x="70" y="186" width="110" height="6" rx="3" fill="#334155"/><rect x="94" y="202" width="53" height="6" rx="3" fill="#334155"/><rect x="70" y="218" width="104" height="6" rx="3" fill="#334155"/><rect x="82" y="234" width="86" height="6" rx="3" fill="#334155"/><rect x="82" y="250" width="97" height="6" rx="3" fill="#334155"/><rect x="70" y="266" width="106" height="6" rx="3" fill="#334155"/>
<rect x="280" y="72" width="162" height="210" rx="8" fill="#111827" stroke="#334155"/><rect x="280" y="72" width="162" height="20" rx="8" fill="#1F2937"/><rect x="280" y="84" width="162" height="8" fill="#1F2937"/><circle cx="292" cy="82" r="3.5" fill="#F87171"/><circle cx="304" cy="82" r="3.5" fill="#FBBF24"/><circle cx="316" cy="82" r="3.5" fill="#34D399"/><text x="361.0" y="86" font-size="10" fill="#94A3B8" text-anchor="middle">notes</text><rect x="304" y="110" width="50" height="6" rx="3" fill="#334155"/><rect x="292" y="126" width="91" height="6" rx="3" fill="#2E5A6B"/><rect x="316" y="142" width="84" height="6" rx="3" fill="#2E5A6B"/><rect x="316" y="158" width="61" height="6" rx="3" fill="#334155"/><rect x="292" y="174" width="97" height="6" rx="3" fill="#334155"/><rect x="292" y="190" width="88" height="6" rx="3" fill="#2E5A6B"/><rect x="304" y="206" width="90" height="6" rx="3" fill="#3B4A63"/><rect x="292" y="222" width="56" height="6" rx="3" fill="#2E5A6B"/><rect x="292" y="238" width="101" height="6" rx="3" fill="#334155"/><rect x="316" y="254" width="64" height="6" rx="3" fill="#334155"/><rect x="304" y="270" width="66" height="6" rx="3" fill="#3B4A63"/>
<!-- right screen: terminal split into panes C and D -->
<rect x="512" y="48" width="396" height="246" rx="8" fill="#111827" stroke="#334155"/><rect x="512" y="48" width="396" height="20" rx="8" fill="#1F2937"/><rect x="512" y="60" width="396" height="8" fill="#1F2937"/><circle cx="524" cy="58" r="3.5" fill="#F87171"/><circle cx="536" cy="58" r="3.5" fill="#FBBF24"/><circle cx="548" cy="58" r="3.5" fill="#34D399"/><text x="710.0" y="62" font-size="10" fill="#94A3B8" text-anchor="middle">terminal — 2 panes</text>
<line x1="710" y1="70" x2="710" y2="290" stroke="#334155" stroke-width="2"/>
<rect x="554" y="74" width="91" height="6" rx="3" fill="#2E5A6B"/><rect x="530" y="90" width="128" height="6" rx="3" fill="#3B4A63"/><rect x="554" y="106" width="99" height="6" rx="3" fill="#2B3B52"/><rect x="530" y="122" width="119" height="6" rx="3" fill="#3B4A63"/><rect x="554" y="138" width="70" height="6" rx="3" fill="#2E5A6B"/><rect x="542" y="154" width="56" height="6" rx="3" fill="#2E5A6B"/><rect x="542" y="170" width="67" height="6" rx="3" fill="#2B3B52"/><rect x="554" y="186" width="54" height="6" rx="3" fill="#3B4A63"/><rect x="530" y="202" width="119" height="6" rx="3" fill="#2E5A6B"/><rect x="554" y="218" width="115" height="6" rx="3" fill="#2E5A6B"/><rect x="530" y="234" width="72" height="6" rx="3" fill="#2E5A6B"/><rect x="542" y="250" width="122" height="6" rx="3" fill="#2E5A6B"/><rect x="542" y="266" width="108" height="6" rx="3" fill="#3B4A63"/><rect x="748" y="74" width="118" height="6" rx="3" fill="#2B3B52"/><rect x="724" y="90" width="73" height="6" rx="3" fill="#2B3B52"/><rect x="724" y="106" width="59" height="6" rx="3" fill="#2B3B52"/><rect x="736" y="122" width="76" height="6" rx="3" fill="#2B3B52"/><rect x="748" y="138" width="88" height="6" rx="3" fill="#3B4A63"/><rect x="724" y="154" width="115" height="6" rx="3" fill="#2B3B52"/><rect x="748" y="170" width="114" height="6" rx="3" fill="#2E5A6B"/><rect x="748" y="186" width="78" height="6" rx="3" fill="#2B3B52"/><rect x="748" y="202" width="95" height="6" rx="3" fill="#2B3B52"/><rect x="724" y="218" width="64" height="6" rx="3" fill="#2B3B52"/><rect x="748" y="234" width="61" height="6" rx="3" fill="#3B4A63"/><rect x="724" y="250" width="67" height="6" rx="3" fill="#2B3B52"/><rect x="724" y="266" width="137" height="6" rx="3" fill="#2B3B52"/>
<!-- focus highlights (switch ~0.3 s after the gaze settles) -->
<rect x="55" y="73" width="196" height="212" rx="10" fill="none" stroke="#818CF8" stroke-width="3" opacity="0" filter="url(#glow)"><animate attributeName="opacity" values="1;0" keyTimes="0;0.28" dur="10s" calcMode="discrete" repeatCount="indefinite"/></rect><rect x="277" y="93" width="168" height="192" rx="10" fill="none" stroke="#818CF8" stroke-width="3" opacity="0" filter="url(#glow)"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.28;0.53" dur="10s" calcMode="discrete" repeatCount="indefinite"/></rect><rect x="515" y="57" width="196" height="228" rx="10" fill="none" stroke="#818CF8" stroke-width="3" opacity="0" filter="url(#glow)"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.53;0.78" dur="10s" calcMode="discrete" repeatCount="indefinite"/></rect><rect x="709" y="57" width="196" height="228" rx="10" fill="none" stroke="#818CF8" stroke-width="3" opacity="0" filter="url(#glow)"><animate attributeName="opacity" values="0;1" keyTimes="0;0.78" dur="10s" calcMode="discrete" repeatCount="indefinite"/></rect>
<!-- mouse pointer is brought along to the new screen -->
<g><path d="M0 0 L0 17 L5 12 L9 20 L12 18 L8 11 L14 11 Z" fill="#fff" stroke="#0F172A" stroke-width="1"/>
<animateTransform attributeName="transform" type="translate" values="370,250;800,250;800,250" keyTimes="0;0.53;1" dur="10s" calcMode="discrete" repeatCount="indefinite"/></g>
<!-- gaze -->
<circle r="20" fill="url(#gaze)">
<animate attributeName="cx" dur="10s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.2;0.25;0.45;0.5;0.7;0.75;0.95;1"
 values="153;153;360;360;613;613;807;807;153"
 keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1"/>
<animate attributeName="cy" dur="10s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.2;0.25;0.45;0.5;0.7;0.75;0.95;1"
 values="170;170;180;180;160;160;190;190;170"
 keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1"/>
</circle>
<!-- captions -->
<text x="480" y="378" font-size="22" font-weight="600" fill="#E2E8F0" text-anchor="middle" opacity="0">Keyboard focus follows your eyes<animate attributeName="opacity" values="1;0;1" keyTimes="0;0.22;0.97" dur="10s" calcMode="discrete" repeatCount="indefinite"/></text><text x="480" y="378" font-size="22" font-weight="600" fill="#E2E8F0" text-anchor="middle" opacity="0">Look at another window — it gets focus<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.22;0.47" dur="10s" calcMode="discrete" repeatCount="indefinite"/></text><text x="480" y="378" font-size="22" font-weight="600" fill="#E2E8F0" text-anchor="middle" opacity="0">Turn to the other screen — focus and pointer follow<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.47;0.72" dur="10s" calcMode="discrete" repeatCount="indefinite"/></text><text x="480" y="378" font-size="22" font-weight="600" fill="#E2E8F0" text-anchor="middle" opacity="0">Look at a split pane — that pane gets focus<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.72;0.97" dur="10s" calcMode="discrete" repeatCount="indefinite"/></text><text x="480" y="402" font-size="12" fill="#64748B" text-anchor="middle">red glow = where you look · outline = what has keyboard focus</text></svg>